{{define "thermal"}}
<section id="thermal" aria-labelledby="thermal-title">
  <h2 id="thermal-title">Thermal loops</h2>
  <p>Heater hysteresis prevents repeated switching inside the temperature band.</p>
  <form hx-post="/commands" hx-target="#thermal-result">
    <input type="hidden" name="kind" value="set-heater">
    <label for="heater-power">Requested heater power, W</label>
    <input id="heater-power" name="value" type="number" min="0" max="5000" step="10" value="0">
    <button type="submit" accesskey="h" aria-keyshortcuts="H">Request heater power</button>
  </form>
  <output id="thermal-result" aria-live="polite">No heater command submitted.</output>
</section>
{{end}}
